{% extends "base_template.html" %}
{% load static %}

{% block title %}Código de Verificación{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Código de Verificación</h1>
    <form method="post" action="{% url 'verificar_codigo' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="codigo">Ingrese el código de verificación:</label>
            <input type="text" class="form-control" id="codigo" name="codigo" required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Enviar Código de Verificación</button>
    </form>
    {% if error_message %}
        <div class="alert alert-danger mt-3" role="alert">
            {{ error_message }}
        </div>
    {% endif %}

</div>

{% endblock %}
